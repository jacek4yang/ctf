name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      - name: Native X11 clipboard tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
          xvfb-run -a cargo test --test cli -- --ignored --test-threads=1
      - run: cargo build --release
      - name: Bash smoke test
        run: bash tests/smoke.bash
